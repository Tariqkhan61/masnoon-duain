<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسنون دعائیں - Muhammad Tariq Mahboob</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #D4AF37;
    font-family: 'Jameel Noori Nastaleeq', 'Noto Naskh Arabic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(180deg, #121212 0%, #0a0a0a 100%);
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
  }
  header h1 { font-size: 2.2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
  header p { color: #aaaaaa; font-size: 1rem; }
  
  .search-container { text-align: center; padding: 20px; }
  .search-container input {
    width: 80%; max-width: 500px;
    padding: 12px 20px;
    border-radius: 25px;
    border: 1px solid rgba(212, 175, 55, 0.5);
    background: #121212;
    color: #fff;
    font-family: 'Jameel Noori Nastaleeq', sans-serif;
    font-size: 1.1rem;
    outline: none;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .card {
    background: #1a103c;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    color: #D4AF37;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card:hover {
    background: #231550;
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
  }
  .card .icon { font-size: 2rem; margin-bottom: 10px; }
  .card .title { font-size: 1.3rem; font-weight: bold; }
  .card .count { font-size: 0.9rem; color: #fff; background: #D4AF37; padding: 2px 10px; border-radius: 15px; margin-top: 10px; color: #000; font-weight: bold; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>✨ مسنون دعائیں ✨</h1>
  <p>Muhammad Tariq Mahboob</p>
</header>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="🔍 دعا تلاش کریں..." onkeyup="filterCategories()">
</div>

<div class="grid-container" id="categoryGrid">
  <!-- کیٹیگریز کا ڈیٹا JavaScript سے لوڈ ہوگا -->
</div>

<script>
  const categories = [
    { name: "صبح و شام کی دعائیں", icon: "🌅", id: "morning_evening" },
    { name: "سونے اور بیدار ہونے کی دعائیں", icon: "🌙", id: "sleep" },
    { name: "کھانے پینے کی دعائیں", icon: "🍽️", id: "food" },
    { name: "واش روم کی دعائیں", icon: "🚻", id: "bathroom" },
    { name: "گھر سے متعلق دعائیں", icon: "🏠", id: "home" },
    { name: "وضو اور طہارت کی دعائیں", icon: "💧", id: "wudu" },
    { name: "مسجد اور نماز کی دعائیں", icon: "🕌", id: "salah" },
    { name: "سفر کی دعائیں", icon: "✈️", id: "travel" },
    { name: "موسم اور قدرتی آفات", icon: "🌤️", id: "weather" },
    { name: "بیماری اور صحت", icon: "🩺", id: "health" },
    { name: "پریشانی، خوف اور حفاظت", icon: "🛡️", id: "protection" },
    { name: "والدین، اولاد اور خاندان", icon: "👨‍👩‍👧‍👦", id: "family" },
    { name: "خوشی، غم اور معاشرتی", icon: "🤝", id: "social" },
    { name: "رزق، کاروبار اور برکت", icon: "💰", id: "wealth" },
    { name: "توبہ، استغفار اور عبادات", icon: "🤲", id: "repentance" },
    { name: "وفات اور قبرستان", icon: "⚰️", id: "death" }
  ];

  const grid = document.getElementById('categoryGrid');

  categories.forEach(cat => {
    const card = document.createElement('a');
    card.href = `dua.html?cat=${cat.id}`;
    card.className = 'card';
    card.setAttribute('data-name', cat.name);
    card.innerHTML = `
      <div class="icon">${cat.icon}</div>
      <div class="title">${cat.name}</div>
      <div class="count">پڑھیں</div>
    `;
    grid.appendChild(card);
  });

  function filterCategories() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const name = card.getAttribute('data-name');
      if (name.includes(input)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
