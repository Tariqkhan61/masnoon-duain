<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسنون دعائیں - Muhammad Tariq Mahboob</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #D4AF37;
    font-family: 'Jameel Noori Nastaleeq', 'Noto Naskh Arabic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    text-align: center;
    padding: 20px;
    background: linear-gradient(180deg, #121212 0%, #0a0a0a 100%);
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    position: relative;
  }
  header h1 { font-size: 2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
  .back-btn {
    position: absolute;
    top: 25px;
    right: 20px;
    color: #D4AF37;
    text-decoration: none;
    font-size: 1.2rem;
    background: rgba(212, 175, 55, 0.1);
    padding: 5px 15px;
    border-radius: 20px;
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .back-btn:hover { background: rgba(212, 175, 55, 0.3); }

  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 15px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }
  
  .dua-card {
    background: #1a103c;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 15px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    position: relative;
  }
  
  .dua-title {
    color: #D4AF37;
    font-size: 1.8rem;
    margin-bottom: 20px;
    text-decoration: underline;
    text-decoration-color: rgba(212, 175, 55, 0.4);
    text-underline-offset: 8px;
  }

  .arabic-text {
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 2rem;
    line-height: 2.2;
    color: #ffffff;
    margin-bottom: 25px;
    direction: rtl;
  }

  .urdu-text-box {
    background: #11092b;
    border-right: 4px solid #D4AF37;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: right;
  }

  .urdu-text {
    font-size: 1.4rem;
    color: #e0e0e0;
    line-height: 1.8;
  }

  .reference {
    display: inline-block;
    color: #ffffff;
    background: #0a0a0a;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 1rem;
    border: 1px dashed rgba(212, 175, 55, 0.5);
  }

  @media (max-width: 600px) {
    .arabic-text { font-size: 1.6rem; }
    .urdu-text { font-size: 1.2rem; }
    .dua-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">⬅ واپس</a>
  <h1>✨ مسنون دعائیں ✨</h1>
  <p id="category-name" style="color: #aaa;">لوڈ ہو رہا ہے...</p>
</header>

<div class="container" id="duaContainer">
  <!-- دعائیں یہاں JavaScript کے ذریعے لوڈ ہوں گی -->
</div>

<!-- ڈیٹا فائل کو لنک کریں -->
<script src="duasData.js"></script>
<script>
  // URL سے کیٹیگری کا نام نکالیں (مثلاً dua.html?cat=food)
  const urlParams = new URLSearchParams(window.location.search);
  const categoryKey = urlParams.get('cat') || 'morning_evening'; // ڈیفالٹ صبح و شام

  const container = document.getElementById('duaContainer');
  const categoryNameEl = document.getElementById('category-name');

  // ڈیٹا چیک کریں کہ موجود ہے یا نہیں
  if (allDuas[categoryKey]) {
    const category = allDuas[categoryKey];
    categoryNameEl.innerText = category.title;

    // ہر دعا کے لیے کارڈ بنائیں
    category.duas.forEach(dua => {
      const card = document.createElement('div');
      card.className = 'dua-card';
      card.innerHTML = `
        <h2 class="dua-title">${dua.title}</h2>
        <div class="arabic-text">${dua.arabic}</div>
        <div class="urdu-text-box">
          <div class="urdu-text">${dua.urdu}</div>
        </div>
        <div class="reference">📖 حوالہ: ${dua.ref}</div>
      `;
      container.appendChild(card);
    });
  } else {
    container.innerHTML = `<h2 style="text-align:center; color:#fff;">معذرت، یہ کیٹیگری موجود نہیں ہے۔</h2>`;
  }
</script>

</body>
</html>
